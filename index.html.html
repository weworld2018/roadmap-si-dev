<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap peminatan SI UT (prototipe)</title>
  <style>
/* Prototipe roadmap peminatan SI UT.
   Token: tinta biru gelap di atas kertas dingin; empat warna jalur sesuai arah matkul. */
:root {
  --ink: #17202e;
  --ink-2: #4a5568;
  --paper: #f5f7fa;
  --white: #ffffff;
  --line: #d3d9e2;
  --pl: #3552c9;
  --data: #0a7f6e;
  --infra: #b8530a;
  --lain: #5a6472;
  --pl-bg: #eef1fd;
  --data-bg: #e8f6f3;
  --infra-bg: #fcf0e6;
  --lain-bg: #eff1f4;
  --warn: #8a5a00;
  --warn-bg: #fff4d6;
  --ok: #176b3a;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--paper); line-height: 1.5; font-size: 16px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; }
p { margin: 0 0 .75rem; }
.mono { font-family: var(--mono); font-size: .8em; }

.banner { background: var(--warn-bg); color: var(--warn); font-size: .88rem; padding: .5rem 1rem; border-bottom: 1px solid #ecd9a3; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1.25rem; background: var(--white); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 1.15rem; font-weight: 700; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 1.25rem; }
.narrow { max-width: 640px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

.link { background: none; border: 0; color: var(--pl); text-decoration: underline; padding: .25rem; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--white); padding: .6rem 1.1rem; border-radius: 6px; font-weight: 600; }
.btn:hover { background: #26324a; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: #e9edf3; }
.btn.small { padding: .35rem .7rem; font-size: .88rem; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.row.between { justify-content: space-between; }
.hint { color: var(--ink-2); font-size: .92rem; }
.err { color: #a12622; font-size: .92rem; }
.stack > * + * { margin-top: 1rem; }

.step-title { font-size: 1.45rem; margin-bottom: .35rem; }
.field label { display: block; font-weight: 600; margin-bottom: .3rem; }
.field input[type=text], .field input[type=password], .field select, .field textarea { width: 100%; padding: .55rem .65rem; border: 1px solid #aab3c0; border-radius: 6px; background: var(--white); }

.choices { display: grid; gap: .75rem; grid-template-columns: 1fr 1fr; }
.choice { text-align: left; background: var(--white); border: 1.5px solid var(--line); border-radius: 8px; padding: 1rem; }
.choice:hover { border-color: var(--ink); }
.choice[aria-pressed=true] { border-color: var(--ink); background: #eaeff7; box-shadow: inset 4px 0 0 var(--ink); }
.choice strong { display: block; font-size: 1.05rem; }
.choice span { color: var(--ink-2); font-size: .92rem; }
.radio-list { display: grid; gap: .5rem; }
.radio-list label { display: flex; gap: .6rem; align-items: flex-start; background: var(--white); border: 1px solid var(--line); border-radius: 6px; padding: .6rem .75rem; }
.radio-list input { margin-top: .3rem; }

/* formulir nilai */
details.sem { background: var(--white); border: 1px solid var(--line); border-radius: 8px; margin-bottom: .6rem; }
details.sem > summary { cursor: pointer; padding: .65rem .9rem; font-weight: 700; }
.nilai-row { display: grid; grid-template-columns: 1fr 9.5rem; gap: .6rem; align-items: center; padding: .4rem .9rem; border-top: 1px solid #eef0f4; }
.nilai-row select { padding: .35rem .4rem; border: 1px solid #aab3c0; border-radius: 6px; background: var(--white); }
.arah-dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .4rem; vertical-align: baseline; }
.a-pl { --c: var(--pl); --cbg: var(--pl-bg); }
.a-data { --c: var(--data); --cbg: var(--data-bg); }
.a-infra { --c: var(--infra); --cbg: var(--infra-bg); }
.a-bisnis, .a-umum { --c: var(--lain); --cbg: var(--lain-bg); }
.arah-dot { background: var(--c); }
.quick { background: #e9edf3; border-radius: 8px; padding: .75rem .9rem; }
fieldset.pem { border: 1px solid var(--line); border-radius: 8px; background: var(--white); padding: .6rem .9rem .9rem; margin: 0 0 .6rem; }
fieldset.pem legend { font-weight: 700; padding: 0 .3rem; }

/* ringkasan hasil */
.summary { display: grid; gap: 1rem; grid-template-columns: 1.1fr 1fr; align-items: start; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; }
.panel h2 { font-size: 1.05rem; margin-bottom: .6rem; }
.bar-row { display: grid; grid-template-columns: 8.5rem 1fr 4.2rem; gap: .6rem; align-items: center; margin: .35rem 0; }
.bar { height: .7rem; background: #e5e9f0; border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c); }
.bar-note { grid-column: 2 / 4; font-size: .82rem; color: var(--ink-2); margin-top: -.2rem; }
.chip { display: inline-block; font-size: .78rem; padding: .05rem .5rem; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.warn { color: var(--warn); background: var(--warn-bg); border-color: #ecd9a3; }
.chip.rec { background: var(--ink); color: var(--white); border-color: var(--ink); }
.chip.seimbang { color: var(--ink); background: #e5e9f0; border-color: #b9c1ce; }
.chip.off { color: #7a8392; background: #eef0f4; border-color: #d3d9e2; }
.chip.done { color: var(--ok); background: #e6f4ec; border-color: #b6dcc4; }
.chip.lock { color: #a12622; background: #fdecea; border-color: #f1c1bd; }
.hasil-kel { border-top: 1px solid #eef0f4; padding-top: .6rem; margin-top: .6rem; }
.hasil-kel:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }

/* roadmap */
.legend { display: flex; flex-wrap: wrap; gap: .5rem 1rem; font-size: .88rem; color: var(--ink-2); margin: 1rem 0 .5rem; }
.road { position: relative; margin-top: .5rem; }
.sem-block { display: grid; grid-template-columns: 3.6rem 1fr; gap: .75rem; position: relative; padding-bottom: 1.1rem; }
.sem-block::before { content: ""; position: absolute; left: 1.55rem; top: 2.2rem; bottom: 0; width: 2px; background: var(--line); }
.sem-block:last-child::before { display: none; }
.sem-tag { display: flex; flex-direction: column; align-items: center; z-index: 1; }
.sem-tag b { width: 3.1rem; height: 2.2rem; display: grid; place-items: center; background: var(--ink); color: var(--white); border-radius: 6px; font-size: .95rem; }
.sem-tag small { color: var(--ink-2); font-size: .72rem; margin-top: .15rem; }
.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; align-items: start; }
.lane-head { font-size: .8rem; font-weight: 700; color: var(--c); border-bottom: 2px solid var(--c); padding-bottom: .15rem; margin-bottom: .1rem; }
.lane-col { display: grid; gap: .5rem; align-content: start; }
.lane-note { grid-column: 1 / -1; font-size: .85rem; color: var(--ink-2); }
.pick-box { margin-top: .6rem; border: 2px dashed var(--ink); border-radius: 8px; padding: .6rem; background: var(--white); }
.pick-box h4 { font-size: .9rem; margin-bottom: .5rem; }
.pick-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: .6rem; align-items: stretch; }
.pick-or { align-self: center; font-weight: 700; color: var(--ink-2); }

.node { text-align: left; width: 100%; background: var(--white); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 6px; padding: .5rem .6rem; display: block; }
.node:hover { background: var(--cbg); }
.node .code { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); display: block; }
.node .name { font-weight: 600; font-size: .92rem; display: block; line-height: 1.3; }
.node .meta { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; align-items: center; font-size: .75rem; color: var(--ink-2); }
.node.sorot { box-shadow: 0 0 0 2px var(--c); background: var(--cbg); }
.node.off { opacity: .55; }
.node.rec { background: var(--cbg); border-width: 1px 1px 1px 5px; box-shadow: 0 0 0 2px var(--ink); }
.node.active { outline: 3px solid #1d4ed8; }

/* panel detail */
.scrim { position: fixed; inset: 0; background: rgba(23, 32, 46, .45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(30rem, 100%); background: var(--white); z-index: 21; overflow-y: auto; padding: 1.1rem 1.25rem 2rem; border-left: 1px solid var(--line); }
.drawer h2 { font-size: 1.25rem; margin: .5rem 0; }
.drawer h3 { font-size: 1rem; margin: 1.1rem 0 .4rem; }
.cover { aspect-ratio: 3 / 4; width: 7.5rem; background: var(--c); color: #fff; border-radius: 4px 8px 8px 4px; padding: .6rem; display: flex; flex-direction: column; justify-content: space-between; font-size: .8rem; box-shadow: inset 6px 0 0 rgba(0,0,0,.25); }
.cover b { font-size: .9rem; line-height: 1.2; }
.cover small { font-family: var(--mono); opacity: .9; }
.detail-top { display: flex; gap: 1rem; align-items: flex-start; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; font-size: .92rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.stacked { display: flex; height: .8rem; border-radius: 4px; overflow: hidden; background: #e5e9f0; margin: .3rem 0; }
.stacked i { display: block; height: 100%; background: var(--c); }
.modul-list { margin: 0; padding-left: 1.2rem; font-size: .9rem; }
.modul-list li { margin: .15rem 0; }
.ulasan { border-top: 1px solid #eef0f4; padding: .6rem 0; font-size: .92rem; }
.tag-dummy { font-size: .72rem; background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 .35rem; margin-left: .3rem; }
.link-list { margin: 0; padding-left: 1.1rem; font-size: .9rem; }
.empty { background: #eef0f4; border-radius: 6px; padding: .7rem .8rem; color: var(--ink-2); font-size: .92rem; }

.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 1rem; }
.modal > .box { position: relative; background: var(--white); border-radius: 10px; padding: 1.25rem; width: min(26rem, 100%); z-index: 31; }
.toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .6rem 1rem; border-radius: 8px; z-index: 40; font-size: .92rem; }

@media (max-width: 900px) {
  .summary { grid-template-columns: 1fr; }
  .lanes { grid-template-columns: 1fr; }
  .lane-head { display: none; }
  .pick-grid { grid-template-columns: 1fr; }
  .pick-or { justify-self: center; }
  .choices { grid-template-columns: 1fr; }
  .sem-block { grid-template-columns: 2.8rem 1fr; gap: .5rem; }
  .sem-block::before { left: 1.3rem; }
  .sem-tag b { width: 2.6rem; }
  .bar-row { grid-template-columns: 6.5rem 1fr 3.6rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: masuk .18s ease-out; }
  @keyframes masuk { from { transform: translateX(14px); opacity: .0; } to { transform: none; opacity: 1; } }
}

</style>
</head>

  <script>
/*
 * skor.js - logika rekomendasi peminatan (rule-based), tanpa library.
 * Berjalan di browser (window.Skor) dan di Node (require).
 *
 * Alur:
 *   1. matkulDalamJendela : hanya matkul semester < semester kelompok yang dipilih
 *   2. kekuatanCabang     : rata-rata nilai berbobot SKS x bobot arah (mode nilai)
 *   3. kekuatanManual     : kekuatan dari pilihan minat (mode manual)
 *   4. skorPertanyaan, gabungKekuatan : jawaban pertanyaan memperkuat hasil
 *   5. kecocokan, nilaiKelompok       : bandingkan matkul dalam satu kelompok pilihan
 *   6. statusKetersediaan, statusCapstone : aturan pasangan dan prasyarat TAPS
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Skor = factory();
})(this, function () {
  'use strict';

  const NILAI = { A: 4, B: 3, C: 2, D: 1, E: 0 };   // cek skala resmi UT
  const CABANG = ['pl', 'data', 'infra'];             // arah lain (bisnis, umum) tidak dihitung
  const KONFIG = { bobotNilai: 0.7, bobotPertanyaan: 0.3, ambangSeimbang: 10 };

  const bulat1 = (x) => Math.round(x * 10) / 10;

  // Matkul yang boleh dinilai: semester lebih kecil dari semester kelompok target.
  function matkulDalamJendela(matkul, semesterTarget) {
    return matkul.filter((m) => m.semester < semesterTarget);
  }

  // Mode nilai. nilai = { KODE: 'A'..'E' }; kode tanpa nilai atau 'Belum' diabaikan.
  function kekuatanCabang(nilai, matkul, semesterTarget) {
    const acc = {};
    CABANG.forEach((c) => (acc[c] = { pemb: 0, peny: 0, sks: 0 }));
    matkulDalamJendela(matkul, semesterTarget).forEach((m) => {
      const huruf = nilai[m.kode];
      if (!(huruf in NILAI)) return;
      CABANG.forEach((c) => {
        const b = (m.arah[c] || 0) / 100;
        if (b <= 0) return;
        acc[c].pemb += m.sks * b * NILAI[huruf];
        acc[c].peny += m.sks * b * 4;
        acc[c].sks += m.sks * b;
      });
    });
    const out = {};
    CABANG.forEach((c) => {
      out[c] = acc[c].peny > 0
        ? { persen: bulat1((100 * acc[c].pemb) / acc[c].peny), sksEfektif: bulat1(acc[c].sks) }
        : { persen: null, sksEfektif: 0 };
    });
    return out;
  }

  // Mode manual: pilihan = 'pl' | 'data' | 'infra' | 'seimbang'
  function kekuatanManual(pilihan) {
    const out = {};
    CABANG.forEach((c) => {
      const p = pilihan === 'seimbang' ? 50 : pilihan === c ? 100 : 0;
      out[c] = { persen: p, sksEfektif: 0 };
    });
    return out;
  }

  // jawaban = { idPertanyaan: indeksOpsi }; hanya opsi yang punya arah yang dihitung.
  function skorPertanyaan(jawaban, pertanyaan) {
    const cacah = { pl: 0, data: 0, infra: 0 };
    let total = 0;
    pertanyaan.forEach((q) => {
      const idx = jawaban[q.id];
      if (idx === undefined || !q.opsi[idx]) return;
      const a = q.opsi[idx].arah;
      if (a && a in cacah) { cacah[a] += 1; total += 1; }
    });
    if (total === 0) return null;
    const out = {};
    CABANG.forEach((c) => (out[c] = { persen: bulat1((100 * cacah[c]) / total) }));
    return out;
  }

  function gabungKekuatan(kNilai, kPertanyaan, konfig) {
    const k = Object.assign({}, KONFIG, konfig || {});
    const out = {};
    CABANG.forEach((c) => {
      const n = kNilai && kNilai[c] ? kNilai[c].persen : null;
      const p = kPertanyaan && kPertanyaan[c] ? kPertanyaan[c].persen : null;
      let persen = null;
      if (n !== null && p !== null) persen = bulat1(k.bobotNilai * n + k.bobotPertanyaan * p);
      else if (n !== null) persen = n;
      else if (p !== null) persen = p;
      out[c] = { persen, sksEfektif: kNilai && kNilai[c] ? kNilai[c].sksEfektif : 0 };
    });
    return out;
  }

  // Kecocokan satu matkul peminatan = rata-rata kekuatan cabang berbobot arah matkul itu.
  // Null bila matkul tidak punya arah yang dihitung atau cabangnya belum punya bukti.
  function kecocokan(m, kekuatan) {
    let pemb = 0, peny = 0;
    CABANG.forEach((c) => {
      const b = m.arah[c] || 0;
      const p = kekuatan[c] ? kekuatan[c].persen : null;
      if (b > 0 && p !== null) { pemb += b * p; peny += b; }
    });
    return peny > 0 ? bulat1(pemb / peny) : null;
  }

  // Tiga keadaan: 'rekomendasi', 'seimbang', 'tidak_ada_dasar'.
  function nilaiKelompok(anggota, kekuatan, konfig) {
    const k = Object.assign({}, KONFIG, konfig || {});
    const skor = anggota.map((m) => ({ kode: m.kode, kecocokan: kecocokan(m, kekuatan) }));
    if (skor.some((s) => s.kecocokan === null) || skor.every((s) => s.kecocokan <= 0)) {
      return { keadaan: 'tidak_ada_dasar', skor, rekomendasi: null };
    }
    const urut = skor.slice().sort((a, b) => b.kecocokan - a.kecocokan);
    const selisih = bulat1(urut[0].kecocokan - urut[urut.length - 1].kecocokan);
    if (selisih < k.ambangSeimbang) return { keadaan: 'seimbang', skor, rekomendasi: null, selisih };
    return { keadaan: 'rekomendasi', skor, rekomendasi: urut[0].kode, selisih };
  }

  // Aturan pilih satu: bila salah satu anggota kelompok sudah diambil, yang lain tidak tersedia.
  function statusKetersediaan(anggotaKodes, sudahDiambil) {
    const diambil = new Set(sudahDiambil);
    const adaYangDiambil = anggotaKodes.some((k) => diambil.has(k));
    const out = {};
    anggotaKodes.forEach((k) => {
      out[k] = diambil.has(k) ? 'sudah_ditempuh' : adaYangDiambil ? 'tidak_tersedia' : 'tersedia';
    });
    return out;
  }

  // Capstone terkunci sampai semua matkul WAJIB TAPS ditempuh.
  function statusCapstone(sudahDitempuh, prasyarat) {
    const ditempuh = new Set(sudahDitempuh);
    const kurang = prasyarat.filter((k) => !ditempuh.has(k));
    return { terbuka: kurang.length === 0, kurang };
  }

  return {
    NILAI, CABANG, KONFIG,
    matkulDalamJendela, kekuatanCabang, kekuatanManual, skorPertanyaan,
    gabungKekuatan, kecocokan, nilaiKelompok, statusKetersediaan, statusCapstone,
  };
});

  const KEY_AKUN = 'proto_akun_v1', KEY_ULASAN = 'proto_ulasan_v1';

  const f1 = (x) => (x === null || x === undefined) ? '-' : (Math.round(x * 10) / 10).toFixed(1).replace('.', ',');
  const dominan = (m) => Object.keys(m.arah).reduce((a, b) => (m.arah[a] >= m.arah[b] ? a : b));
  const laneDari = (m) => { const d = dominan(m); return d === 'pl' || d === 'data' || d === 'infra' ? d : 'lain'; };
  const kelompokDari = (kode) => KEL.find((k) => k.anggota.some((a) => a.kode === kode));
  const adaNilai = (h) => Skor.NILAI[h] !== undefined;
  function hash(s) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.codePointAt(0)) | 0; return String(h); }   // bukan keamanan sungguhan
  function baca(key, awal) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : awal; } catch (e) { return awal; } }
  function tulis(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* abaikan */ } }

  const NodeMatkul = {
    props: ['m', 'st', 'sorot', 'aktif'],
    emits: ['buka'],
    computed: { arah() { return dominan(this.m); } },
    template: `
      <button type="button" class="node" :class="['a-' + arah, { sorot: sorot, off: st.off, rec: st.rec, active: aktif }]"
              @click="$emit('buka', m.kode)"
              :aria-label="m.nama + ', semester ' + m.semester + (st.teks ? ', ' + st.teks : '')">
        <span class="code">{{ m.kode }}</span>
        <span class="name">{{ m.nama }}</span>
        <span class="meta">
          <span>{{ m.sks }} SKS</span>
          <span v-if="m.jenis === 'pilihan'" class="chip seimbang">peminatan</span>
          <span v-if="st.teks" class="chip" :class="st.kelas">{{ st.teks }}</span>
        </span>
      </button>`,
  };

  const App = {
    components: { NodeMatkul },
    data() {
      return {
        langkah: 'nim', nim: '', password: '', pesan: '', masuk: false, adaAkun: false,
        akun: baca(KEY_AKUN, {}), ulasanSimpan: baca(KEY_ULASAN, []),
        status: null, target: 5, mode: null, minat: null, tahapNilai: 1,
        nilai: {}, ambil: {}, ditempuh: {}, jawaban: {},
        detailKode: null, modalSimpan: false, setuju: false, passBaru: '', pesanModal: '', notif: '',
        formUlasan: { rating: '', kesulitan: '', beban: '', jam: '', status: 'selesai', pengalaman: '', tips: '' }, pesanUlasan: '',
        CAB, ARAH_NAMA, LANES, BUKTI_MIN, pertanyaan: DATA.pertanyaan, kelompok: KEL,
      };
    },
    computed: {
      semesterList() { return Array.from({ length: this.target - 1 }, (_, i) => i + 1); },
      kelompokAmbil() { return KEL.filter((k) => k.semester < this.target || (k.semester === this.target && this.status === 'NON_SIPAS')); },
      tapsLuar() { return this.status === 'NON_SIPAS' ? DATA.prasyaratCapstone.map((k) => BYK[k]).filter((m) => m.semester >= this.target) : []; },
      sudahDiambil() { return this.kelompokAmbil.map((k) => this.ambil[k.kode]).filter(Boolean); },
      nilaiHitung() {
        const out = {};
        Object.keys(this.nilai).forEach((kode) => {
          if (!adaNilai(this.nilai[kode])) return;
          const m = BYK[kode];
          if (m.semester >= this.target) return;
          if (m.jenis === 'pilihan') { const k = kelompokDari(kode); if (this.ambil[k.kode] !== kode) return; }
          out[kode] = this.nilai[kode];
        });
        return out;
      },
      kekuatan() {
        if (this.mode === 'manual' && this.minat) return Skor.kekuatanManual(this.minat);
        if (this.mode === 'nilai') {
          const kN = Skor.kekuatanCabang(this.nilaiHitung, M, this.target);
          const kP = Skor.skorPertanyaan(this.jawaban, DATA.pertanyaan);
          return Skor.gabungKekuatan(kN, kP);
        }
        return null;
      },
      cabangTeratas() {
        if (!this.kekuatan) return null;
        const ada = Object.keys(CAB).filter((c) => this.kekuatan[c].persen !== null);
        if (!ada.length) return null;
        const maks = Math.max(...ada.map((c) => this.kekuatan[c].persen));
        const top = ada.filter((c) => this.kekuatan[c].persen === maks);
        return top.length === 1 && maks > 0 ? top[0] : null;
      },
      statusKel() {
        const o = {};
        KEL.forEach((k) => { o[k.kode] = Skor.statusKetersediaan(k.anggota.map((a) => a.kode), this.sudahDiambil); });
        return o;
      },
      hasilKelompok() {
        if (!this.kekuatan) return [];
        return KEL.filter((k) => k.semester === this.target).map((k) => ({
          k, anggota: k.anggota.map((a) => BYK[a.kode]),
          res: Skor.nilaiKelompok(k.anggota.map((a) => BYK[a.kode]), this.kekuatan),
          st: this.statusKel[k.kode],
        }));
      },
      capstone() {
        if (this.status === 'SIPAS') return { terbuka: true, kurang: [], catatan: 'Mengikuti urutan paket semester.' };
        const ditempuh = Object.keys(this.nilai).filter((k) => adaNilai(this.nilai[k])).concat(Object.keys(this.ditempuh).filter((k) => this.ditempuh[k]));
        return Object.assign({ catatan: '' }, Skor.statusCapstone(ditempuh, DATA.prasyaratCapstone));
      },
      blok() {
        return Array.from({ length: 8 }, (_, i) => i + 1).map((s) => {
          const ms = M.filter((m) => m.semester === s && m.jenis !== 'pilihan');
          const lanes = { pl: [], data: [], infra: [], lain: [] };
          ms.forEach((m) => lanes[laneDari(m)].push(m));
          const kel = KEL.filter((k) => k.semester === s).map((k) => ({ k, anggota: k.anggota.map((a) => BYK[a.kode]) }));
          const sks = M.filter((m) => m.semester === s).reduce((a, m) => a + m.sks, 0);
          return { s, lanes, kel, sks, jml: M.filter((m) => m.semester === s).length };
        });
      },
      detail() { return this.detailKode ? BYK[this.detailKode] : null; },
      detailModul() { return this.detail ? (DUM.modul[this.detailKode] || []) : []; },
      detailDari() { return this.detail ? DUM.edges.filter((e) => e.ke === this.detailKode) : []; },
      detailKe() { return this.detail ? DUM.edges.filter((e) => e.dari === this.detailKode) : []; },
      detailArah() { return this.detail ? Object.entries(this.detail.arah).sort((a, b) => b[1] - a[1]) : []; },
      ulasanDetail() {
        const kode = this.detailKode;
        const list = (DUM.ulasan[kode] || []);
        const saya = this.ulasanSimpan.filter((u) => u.kode === kode && u.nim === this.nim);
        const avg = (f) => (list.length ? list.reduce((a, u) => a + u[f], 0) / list.length : null);
        return { list, saya, n: list.length, rating: avg('rating'), kesulitan: avg('kesulitan'), beban: avg('beban'), jam: avg('jam') };
      },
      riwayat() { return this.akun[this.nim] ? this.akun[this.nim].riwayat : []; },
    },
    methods: {
      f1, dominan,
      lanjutNim() {
        const n = this.nim.trim().toUpperCase();
        if (!/^[A-Z0-9]{5,20}$/.test(n)) { this.pesan = 'NIM harus 5 sampai 20 huruf atau angka. Format NIM UT belum divalidasi di prototipe.'; return; }
        this.nim = n; this.pesan = ''; this.masuk = false; this.adaAkun = !!this.akun[n];
        this.langkah = this.adaAkun ? 'password' : 'status';
      },
      masukAkun() {
        const a = this.akun[this.nim];
        if (a && a.hash === hash(this.password)) { this.masuk = true; this.pesan = ''; this.password = ''; this.langkah = 'riwayat'; }
        else this.pesan = 'Password tidak cocok.';
      },
      hapusRiwayat() { if (this.akun[this.nim]) { this.akun[this.nim].riwayat = []; tulis(KEY_AKUN, this.akun); this.notifikasi('Riwayat dihapus.'); } },
      bukaRiwayat(r) {
        this.status = r.status; this.target = r.target; this.mode = r.mode; this.minat = r.minat;
        this.nilai = Object.assign({}, r.nilai); this.ambil = Object.assign({}, r.ambil); this.jawaban = Object.assign({}, r.jawaban); this.ditempuh = Object.assign({}, r.ditempuh);
        this.langkah = 'roadmap';
      },
      pilihMode(m) { this.mode = m; this.tahapNilai = 1; this.pesan = ''; this.langkah = m === 'manual' ? 'manual' : 'nilai'; },
      lihatManual() { if (!this.minat) { this.pesan = 'Pilih salah satu minat dulu.'; return; } this.pesan = ''; this.langkah = 'roadmap'; },
      lanjutNilai() {
        if (this.tahapNilai === 1) {
          if (!Object.keys(this.nilaiHitung).length) { this.pesan = 'Isi minimal satu nilai. Bila belum ada nilai, kembali dan pilih mode manual.'; return; }
          this.pesan = ''; this.tahapNilai = 2; return;
        }
        this.langkah = 'roadmap';
      },
      isiCepat(jenis) {
        const n = {};
        const KD = { STMA4112: 'A', MKKI4201: 'A', STMA4113: 'A', STSI4105: 'A', STIK4111: 'A', STSI4204: 'A', STSI4103: 'C', STSI4205: 'C' };
        const KI = { STSI4103: 'A', STSI4205: 'A', STSI4105: 'C', MKKI4201: 'C', STSI4204: 'C', STIK4111: 'C' };
        M.filter((m) => m.semester < this.target && m.jenis !== 'pilihan').forEach((m) => {
          if (jenis === 'kosong') return;
          n[m.kode] = jenis === 'data' ? (KD[m.kode] || 'B') : jenis === 'infra' ? (KI[m.kode] || 'B') : 'B';
        });
        this.nilai = n; this.ambil = {}; this.pesan = '';
      },
      statusNode(m) {
        if (m.capstone) {
          const c = this.capstone;
          return c.terbuka ? { teks: c.catatan ? 'Terbuka (urutan paket)' : 'Terbuka', kelas: 'done' } : { teks: 'Terkunci', kelas: 'lock', off: true };
        }
        if (m.jenis === 'pilihan') {
          const k = kelompokDari(m.kode), st = this.statusKel[k.kode][m.kode];
          if (st === 'sudah_ditempuh') { const h = this.nilaiHitung[m.kode]; return { teks: h ? 'Diambil, nilai ' + h : 'Diambil', kelas: 'done' }; }
          if (st === 'tidak_tersedia') return { teks: 'Tidak tersedia', kelas: 'off', off: true };
          if (k.semester === this.target && this.kekuatan) {
            const h = this.hasilKelompok.find((x) => x.k.kode === k.kode);
            if (h && h.res.keadaan === 'rekomendasi' && h.res.rekomendasi === m.kode) return { teks: 'Direkomendasikan', kelas: 'rec', rec: true };
            if (h && h.res.keadaan === 'seimbang') return { teks: 'Seimbang', kelas: 'seimbang' };
          }
          return { teks: '', kelas: '' };
        }
        const h = this.nilaiHitung[m.kode];
        if (h) return { teks: 'Nilai ' + h, kelas: 'done' };
        return { teks: '', kelas: '' };
      },
      sorotNode(m) { return !!this.cabangTeratas && laneDari(m) === this.cabangTeratas && m.jenis !== 'pilihan'; },
      keadaanTeks(h) {
        const r = h.res, a = h.anggota, sk = (kode) => r.skor.find((s) => s.kode === kode).kecocokan;
        if (r.keadaan === 'rekomendasi') return 'Direkomendasikan: ' + BYK[r.rekomendasi].nama + '. Kecocokan ' + a.map((m) => f1(sk(m.kode))).join(' berbanding ') + ', selisih ' + f1(r.selisih) + ' poin.';
        if (r.keadaan === 'seimbang') return 'Seimbang. Kecocokan ' + a.map((m) => f1(sk(m.kode))).join(' berbanding ') + ' (selisih ' + f1(r.selisih) + ' poin). Pertimbangkan rating dan review.';
        return 'Tidak ada dasar dari data yang kamu isi. Kedua pilihan tampil sebagai informasi dan roadmap tetap berjalan.';
      },
      bukaDetail(kode) { this.detailKode = kode; this.pesanUlasan = ''; },
      tutupDetail() { this.detailKode = null; },
      simpanHasil() {
        this.pesanModal = '';
        if (!this.setuju) { this.pesanModal = 'Centang persetujuan untuk menyimpan.'; return; }
        if (!this.adaAkun) {
          if (this.passBaru.length < 6) { this.pesanModal = 'Password minimal 6 karakter.'; return; }
          this.akun[this.nim] = { hash: hash(this.passBaru), riwayat: [] }; this.adaAkun = true; this.masuk = true;
        } else if (!this.masuk) { this.pesanModal = 'NIM ini sudah punya password. Mulai dari awal dan masuk dulu untuk menyimpan.'; return; }
        const k = this.kekuatan;
        this.akun[this.nim].riwayat.unshift({
          id: Date.now(), waktu: new Date().toLocaleString('id-ID'), status: this.status, target: this.target, mode: this.mode, minat: this.minat,
          nilai: Object.assign({}, this.nilaiHitung), ambil: Object.assign({}, this.ambil), jawaban: Object.assign({}, this.jawaban), ditempuh: Object.assign({}, this.ditempuh),
          ringkas: 'Data ' + f1(k.data.persen) + '%, Infrastruktur ' + f1(k.infra.persen) + '%, Perangkat Lunak ' + f1(k.pl.persen) + '%',
        });
        tulis(KEY_AKUN, this.akun); this.modalSimpan = false; this.setuju = false; this.passBaru = '';
        this.notifikasi('Hasil disimpan di peramban ini (prototipe, bukan basis data).');
      },
      kirimUlasan() {
        const f = this.formUlasan, ok = (v) => Number(v) >= 1 && Number(v) <= 5;
        if (!ok(f.rating) || !ok(f.kesulitan) || !ok(f.beban)) { this.pesanUlasan = 'Isi rating, kesulitan, dan beban tugas (1 sampai 5).'; return; }
        this.ulasanSimpan.push({ kode: this.detailKode, nim: this.nim, rating: +f.rating, kesulitan: +f.kesulitan, beban: +f.beban, jam: f.jam === '' ? null : +f.jam, status: f.status, pengalaman: f.pengalaman, tips: f.tips, moderasi: 'menunggu' });
        tulis(KEY_ULASAN, this.ulasanSimpan);
        this.formUlasan = { rating: '', kesulitan: '', beban: '', jam: '', status: 'selesai', pengalaman: '', tips: '' };
        this.pesanUlasan = 'Terkirim. Ulasan tampil ke mahasiswa lain setelah disetujui admin (admin belum ada di prototipe).';
      },
      notifikasi(t) { this.notif = t; setTimeout(() => { this.notif = ''; }, 3500); },
      ulang() { Object.assign(this, { langkah: 'nim', nim: '', password: '', pesan: '', masuk: false, adaAkun: false, status: null, target: 5, mode: null, minat: null, tahapNilai: 1, nilai: {}, ambil: {}, ditempuh: {}, jawaban: {}, detailKode: null }); },
      persen(x) { return x === null || x === undefined ? 0 : Math.max(0, Math.min(100, x)); },
    },
    mounted() { window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { this.detailKode = null; this.modalSimpan = false; } }); },
    template: `
    <div>
      <div class="banner">Prototipe untuk menguji tampilan dan alur. Data ulasan adalah contoh, dan akun serta riwayat hanya tersimpan di peramban ini, bukan di basis data.</div>
      <header class="top">
        <h1>Roadmap peminatan Sistem Informasi UT</h1>
        <button v-if="langkah !== 'nim'" class="link" type="button" @click="ulang">Mulai dari awal</button>
      </header>

      <main>
      <!-- 1. NIM -->
      <section v-if="langkah === 'nim'" class="narrow stack">
        <h2 class="step-title">Mulai dengan NIM</h2>
        <p class="hint">NIM dipakai agar hasilmu bisa disimpan dan dibuka lagi nanti. Menyimpan bersifat pilihan.</p>
        <div class="field">
          <label for="nim">NIM</label>
          <input id="nim" type="text" v-model="nim" autocomplete="off" @keyup.enter="lanjutNim" placeholder="contoh: 050123456">
        </div>
        <p v-if="pesan" class="err" role="alert">{{ pesan }}</p>
        <button class="btn" type="button" @click="lanjutNim">Lanjut</button>
      </section>

      <section v-if="langkah === 'password'" class="narrow stack">
        <h2 class="step-title">NIM {{ nim }} sudah punya riwayat</h2>
        <p class="hint">Masukkan password untuk membuka riwayat. Kamu juga bisa lanjut tanpa membukanya, tetapi hasil baru tidak bisa disimpan.</p>
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" v-model="password" @keyup.enter="masukAkun" autocomplete="off">
        </div>
        <p v-if="pesan" class="err" role="alert">{{ pesan }}</p>
        <div class="row">
          <button class="btn" type="button" @click="masukAkun">Buka riwayat</button>
          <button class="btn ghost" type="button" @click="langkah = 'status'; pesan = ''">Lanjut tanpa membuka riwayat</button>
        </div>
      </section>

      <section v-if="langkah === 'riwayat'" class="narrow stack">
        <h2 class="step-title">Riwayat NIM {{ nim }}</h2>
        <div v-if="!riwayat.length" class="empty">Belum ada hasil tersimpan.</div>
        <div v-for="r in riwayat" :key="r.id" class="panel">
          <p><strong>{{ r.waktu }}</strong></p>
          <p class="hint">{{ r.status === 'SIPAS' ? 'SIPAS' : 'Non-SIPAS' }}, memilih peminatan semester {{ r.target }}, mode {{ r.mode }}. {{ r.ringkas }}</p>
          <button class="btn small" type="button" @click="bukaRiwayat(r)">Buka roadmap</button>
        </div>
        <div class="row">
          <button class="btn" type="button" @click="langkah = 'status'">Buat hasil baru</button>
          <button v-if="riwayat.length" class="btn ghost" type="button" @click="hapusRiwayat">Hapus riwayat saya</button>
        </div>
      </section>

      <!-- 2. Status -->
      <section v-if="langkah === 'status'" class="narrow stack">
        <h2 class="step-title">Status kuliahmu</h2>
        <div class="choices">
          <button type="button" class="choice" :aria-pressed="status === 'SIPAS'" @click="status = 'SIPAS'"><strong>SIPAS</strong><span>Mengikuti urutan matkul per semester dari UT.</span></button>
          <button type="button" class="choice" :aria-pressed="status === 'NON_SIPAS'" @click="status = 'NON_SIPAS'"><strong>Non-SIPAS</strong><span>Memilih matkul sendiri tiap semester.</span></button>
        </div>
        <div class="field">
          <label for="tgt">{{ status === 'SIPAS' ? 'Semester yang sedang kamu tempuh' : 'Semester peminatan yang ingin kamu pilih' }}</label>
          <select id="tgt" v-model.number="target">
            <option :value="5">Semester 5</option>
            <option :value="6">Semester 6 (dua kelompok: 6a dan 6b)</option>
            <option :value="7">Semester 7</option>
          </select>
          <p class="hint">Sistem hanya menanyakan nilai semester 1 sampai {{ target - 1 }}.</p>
        </div>
        <div class="row">
          <button class="btn ghost" type="button" @click="langkah = adaAkun ? 'password' : 'nim'">Kembali</button>
          <button class="btn" type="button" :disabled="!status" @click="langkah = 'mode'">Lanjut</button>
        </div>
      </section>

      <!-- 3. Mode -->
      <section v-if="langkah === 'mode'" class="narrow stack">
        <h2 class="step-title">Cara mencari arah</h2>
        <div class="choices">
          <button type="button" class="choice" @click="pilihMode('manual')"><strong>Mode manual</strong><span>Pilih sendiri minatmu. Cepat, satu langkah.</span></button>
          <button type="button" class="choice" @click="pilihMode('nilai')"><strong>Mode nilai</strong><span>Isi nilai matkul, sistem menghitung kekuatanmu di tiap cabang.</span></button>
        </div>
        <button class="btn ghost" type="button" @click="langkah = 'status'">Kembali</button>
      </section>

      <!-- 4a. Manual -->
      <section v-if="langkah === 'manual'" class="narrow stack">
        <h2 class="step-title">Minatmu ke arah mana?</h2>
        <div class="radio-list">
          <label><input type="radio" value="pl" v-model="minat"><span><strong>Pengembangan Perangkat Lunak</strong><br><span class="hint">Membuat aplikasi dan sistem.</span></span></label>
          <label><input type="radio" value="data" v-model="minat"><span><strong>Data dan Analitik</strong><br><span class="hint">Mengolah data, analisis, dan keputusan.</span></span></label>
          <label><input type="radio" value="infra" v-model="minat"><span><strong>Infrastruktur, Jaringan, dan Keamanan</strong><br><span class="hint">Server, jaringan, dan pengamanan sistem.</span></span></label>
          <label><input type="radio" value="seimbang" v-model="minat"><span><strong>Belum tahu atau seimbang</strong><br><span class="hint">Coba mode nilai untuk bantuan yang lebih jelas.</span></span></label>
        </div>
        <p v-if="pesan" class="err" role="alert">{{ pesan }}</p>
        <div class="row">
          <button class="btn ghost" type="button" @click="langkah = 'mode'">Kembali</button>
          <button class="btn" type="button" @click="lihatManual">Lihat roadmap</button>
        </div>
      </section>

      <!-- 4b. Nilai -->
      <section v-if="langkah === 'nilai'" class="narrow stack">
        <template v-if="tahapNilai === 1">
          <h2 class="step-title">Isi nilai semester 1 sampai {{ target - 1 }}</h2>
          <p class="hint">Pilih "Belum" bila matkul belum kamu tempuh. Nilai tidak dikirim ke mana pun kecuali kamu menyimpan hasil.</p>
          <div class="quick">
            <p class="hint" style="margin-bottom:.4rem">Isi cepat untuk uji prototipe:</p>
            <div class="row">
              <button class="btn small ghost" type="button" @click="isiCepat('data')">Contoh kuat data</button>
              <button class="btn small ghost" type="button" @click="isiCepat('infra')">Contoh kuat infrastruktur</button>
              <button class="btn small ghost" type="button" @click="isiCepat('semuaB')">Semua B</button>
              <button class="btn small ghost" type="button" @click="isiCepat('kosong')">Kosongkan</button>
            </div>
          </div>
          <details v-for="s in semesterList" :key="s" class="sem" open>
            <summary>Semester {{ s }}</summary>
            <div v-for="m in M.filter(x => x.semester === s && x.jenis !== 'pilihan')" :key="m.kode" class="nilai-row">
              <label :for="'n-' + m.kode"><span class="arah-dot" :class="'a-' + dominan(m)"></span>{{ m.nama }} <span class="hint">({{ m.sks }} SKS)</span></label>
              <select :id="'n-' + m.kode" v-model="nilai[m.kode]">
                <option value="">pilih</option>
                <option v-for="h in ['A','B','C','D','E']" :key="h" :value="h">{{ h }}</option>
                <option value="Belum">Belum</option>
              </select>
            </div>
          </details>
          <h3 v-if="kelompokAmbil.length" style="margin-top:1.2rem">Peminatan yang sudah kamu ambil</h3>
          <fieldset v-for="k in kelompokAmbil" :key="k.kode" class="pem">
            <legend>Semester {{ k.semester }}{{ k.kode.length > 1 ? ' (kelompok ' + k.kode + ')' : '' }}</legend>
            <div class="field">
              <label :for="'a-' + k.kode">Yang kamu ambil</label>
              <select :id="'a-' + k.kode" v-model="ambil[k.kode]">
                <option value="">belum mengambil</option>
                <option v-for="a in k.anggota" :key="a.kode" :value="a.kode">{{ M.find(x => x.kode === a.kode).nama }}</option>
              </select>
            </div>
            <div v-if="ambil[k.kode] && k.semester < target" class="nilai-row" style="padding-left:0;padding-right:0;border-top:0">
              <span>Nilainya</span>
              <select v-model="nilai[ambil[k.kode]]" :aria-label="'Nilai ' + ambil[k.kode]">
                <option value="">pilih</option>
                <option v-for="h in ['A','B','C','D','E']" :key="h" :value="h">{{ h }}</option>
              </select>
            </div>
          </fieldset>
          <template v-if="tapsLuar.length">
            <h3 style="margin-top:1.2rem">Prasyarat Capstone di luar jendela</h3>
            <p class="hint">Centang bila sudah ditempuh. Ini hanya untuk status Capstone dan tidak memengaruhi rekomendasi.</p>
            <label v-for="m in tapsLuar" :key="m.kode" style="display:block"><input type="checkbox" v-model="ditempuh[m.kode]"> {{ m.nama }}</label>
          </template>
        </template>
        <template v-else>
          <h2 class="step-title">Beberapa pertanyaan</h2>
          <p class="hint">Jawaban memperkuat hasil dari nilai. Boleh dilewati, tetapi hasil akan memakai nilai saja.</p>
          <fieldset v-for="q in pertanyaan" :key="q.id" class="pem">
            <legend>{{ q.teks }}</legend>
            <div class="radio-list">
              <label v-for="(o, i) in q.opsi" :key="i"><input type="radio" :name="'q' + q.id" :value="i" v-model="jawaban[q.id]"><span>{{ o.teks }}</span></label>
            </div>
          </fieldset>
        </template>
        <p v-if="pesan" class="err" role="alert">{{ pesan }}</p>
        <div class="row">
          <button class="btn ghost" type="button" @click="tahapNilai === 2 ? (tahapNilai = 1) : (langkah = 'mode')">Kembali</button>
          <button class="btn" type="button" @click="lanjutNilai">{{ tahapNilai === 1 ? 'Lanjut ke pertanyaan' : 'Lihat roadmap' }}</button>
        </div>
      </section>

      <!-- 5. Roadmap -->
      <section v-if="langkah === 'roadmap'" class="wrap">
        <div class="row between">
          <h2 class="step-title" style="margin:0">Roadmap NIM {{ nim }}</h2>
          <div class="row">
            <button class="btn ghost small" type="button" @click="langkah = 'mode'">Ganti mode</button>
            <button class="btn small" type="button" @click="modalSimpan = true; pesanModal = ''">Simpan hasil</button>
          </div>
        </div>
        <p class="hint">{{ status === 'SIPAS' ? 'SIPAS' : 'Non-SIPAS' }}, memilih peminatan semester {{ target }}, {{ mode === 'manual' ? 'mode manual' : 'mode nilai (semester 1 sampai ' + (target - 1) + ')' }}.</p>

        <div class="summary" style="margin-top:1rem">
          <div class="panel">
            <h2>Kekuatan per cabang</h2>
            <div v-for="(nm, c) in CAB" :key="c" class="bar-row" :class="'a-' + c">
              <span><span class="arah-dot"></span>{{ nm }}</span>
              <span class="bar"><i :style="{ width: persen(kekuatan[c].persen) + '%' }"></i></span>
              <strong>{{ kekuatan[c].persen === null ? 'belum ada' : f1(kekuatan[c].persen) + '%' }}</strong>
              <span class="bar-note">
                <template v-if="mode === 'nilai'">dari {{ f1(kekuatan[c].sksEfektif) }} SKS efektif <span v-if="kekuatan[c].persen !== null && kekuatan[c].sksEfektif < BUKTI_MIN" class="chip warn">bukti terbatas</span></template>
                <template v-else>dari pilihan minatmu</template>
              </span>
            </div>
            <p class="hint" style="margin-top:.6rem">Persentase adalah rata-rata nilai berbobot SKS dan arah matkul. Bisnis dan umum tidak dihitung.</p>
          </div>
          <div class="panel">
            <h2>Pilihan peminatan semester {{ target }}</h2>
            <div v-for="h in hasilKelompok" :key="h.k.kode" class="hasil-kel">
              <p><strong>{{ h.anggota.map(a => a.nama).join(' atau ') }}</strong></p>
              <p v-for="a in h.anggota.filter(x => h.st[x.kode] === 'tidak_tersedia')" :key="a.kode" class="hint">{{ a.nama }} tidak tersedia karena pasangannya sudah diambil.</p>
              <p>{{ keadaanTeks(h) }}</p>
            </div>
          </div>
        </div>

        <div class="legend">
          <span v-for="(nm, c) in ARAH_NAMA" :key="c" :class="'a-' + c"><span class="arah-dot"></span>{{ nm }}</span>
          <span>Garis tebal pada kartu: arah paling kuat darimu. Klik kartu untuk detail.</span>
        </div>

        <div class="road">
          <div v-for="b in blok" :key="b.s" class="sem-block">
            <div class="sem-tag"><b>S{{ b.s }}</b><small>{{ b.sks }} SKS</small></div>
            <div>
              <div class="lanes">
                <div v-for="ln in LANES" :key="ln[0]" class="lane-col" :class="'a-' + ln[0]">
                  <div v-if="b.lanes[ln[0]].length" class="lane-head">{{ ln[1] }}</div>
                  <node-matkul v-for="m in b.lanes[ln[0]]" :key="m.kode" :m="m" :st="statusNode(m)" :sorot="sorotNode(m)" :aktif="detailKode === m.kode" @buka="bukaDetail"></node-matkul>
                </div>
              </div>
              <p v-if="b.s === 8" class="hint" style="margin-top:.4rem">Semester 8 hanya lanjutan: semua mahasiswa menjalaninya.</p>
              <div v-for="g in b.kel" :key="g.k.kode" class="pick-box">
                <h4>Pilih satu{{ g.k.kode.length > 1 ? ' (kelompok ' + g.k.kode + ')' : '' }}</h4>
                <div class="pick-grid">
                  <node-matkul :m="g.anggota[0]" :st="statusNode(g.anggota[0])" :sorot="false" :aktif="detailKode === g.anggota[0].kode" @buka="bukaDetail"></node-matkul>
                  <span class="pick-or">atau</span>
                  <node-matkul :m="g.anggota[1]" :st="statusNode(g.anggota[1])" :sorot="false" :aktif="detailKode === g.anggota[1].kode" @buka="bukaDetail"></node-matkul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      </main>

      <!-- Panel detail -->
      <template v-if="detail">
        <div class="scrim" @click="tutupDetail"></div>
        <aside class="drawer" role="dialog" aria-modal="true" :aria-label="'Detail ' + detail.nama" :class="'a-' + dominan(detail)">
          <button class="link" type="button" @click="tutupDetail">Tutup</button>
          <div class="detail-top">
            <div class="cover" :class="'a-' + dominan(detail)" style="background:var(--c)"><b>{{ detail.nama }}</b><small>{{ detail.kode }}</small></div>
            <dl class="kv">
              <dt>Semester</dt><dd>{{ detail.semester }}</dd>
              <dt>SKS</dt><dd>{{ detail.sks }}</dd>
              <dt>Jenis</dt><dd>{{ detail.jenis === 'pilihan' ? 'Peminatan (pilih satu)' : (detail.wajibTaps ? 'Wajib, prasyarat Capstone' : 'Wajib') }}</dd>
              <dt>Kode kedua</dt><dd>{{ detail.kodeKedua || '-' }}</dd>
            </dl>
          </div>
          <h2>{{ detail.nama }}</h2>
          <p class="hint">Cover di atas hanya penanda. Gambar cover buku menyusul setelah izin penggunaannya dipastikan.</p>

          <h3>Arah materi</h3>
          <div class="stacked"><i v-for="a in detailArah" :key="a[0]" :class="'a-' + a[0]" :style="{ width: a[1] + '%' }" :title="ARAH_NAMA[a[0]] + ' ' + a[1] + '%'"></i></div>
          <p class="hint"><span v-for="(a, i) in detailArah" :key="a[0]">{{ ARAH_NAMA[a[0]] }} {{ a[1] }}%{{ i < detailArah.length - 1 ? ', ' : '' }}</span>. Usulan dari judul modul.</p>

          <h3>Yang dipelajari ({{ detailModul.length }} modul)</h3>
          <ol class="modul-list"><li v-for="md in detailModul" :key="md.no">{{ md.judul }}</li></ol>

          <h3>Hubungan materi</h3>
          <div v-if="detailDari.length">
            <p class="hint" style="margin-bottom:.2rem">Bersambung dari:</p>
            <ul class="link-list"><li v-for="e in detailDari" :key="e.dari + e.mDari"><a href="#" @click.prevent="bukaDetail(e.dari)">{{ M.find(x => x.kode === e.dari).nama }}</a> (modul {{ e.mDari }} ke modul {{ e.mKe }}): {{ e.alasan }}</li></ul>
          </div>
          <div v-if="detailKe.length">
            <p class="hint" style="margin:.5rem 0 .2rem">Berlanjut ke:</p>
            <ul class="link-list"><li v-for="e in detailKe" :key="e.ke + e.mKe"><a href="#" @click.prevent="bukaDetail(e.ke)">{{ M.find(x => x.kode === e.ke).nama }}</a> (modul {{ e.mDari }} ke modul {{ e.mKe }}): {{ e.alasan }}</li></ul>
          </div>
          <div v-if="!detailDari.length && !detailKe.length" class="empty">Belum ada hubungan materi yang dicatat untuk matkul ini.</div>
          <template v-if="detail.capstone">
            <h3>Prasyarat resmi Capstone</h3>
            <ul class="link-list"><li v-for="k in prasyaratCapstone()" :key="k">{{ M.find(x => x.kode === k).nama }}</li></ul>
            <p class="hint">{{ capstone.terbuka ? 'Prasyarat terpenuhi.' : 'Belum ditempuh: ' + capstone.kurang.map(k => M.find(x => x.kode === k).nama).join(', ') + '.' }}</p>
          </template>

          <template v-if="detail.jenis === 'pilihan'">
            <h3>Rating dan review <span class="tag-dummy">data contoh</span></h3>
            <div v-if="ulasanDetail.n" class="stack">
              <dl class="kv">
                <dt>Rating keseluruhan</dt><dd>{{ f1(ulasanDetail.rating) }} dari 5 ({{ ulasanDetail.n }} ulasan)</dd>
                <dt>Kesulitan</dt><dd>{{ f1(ulasanDetail.kesulitan) }} dari 5</dd>
                <dt>Beban tugas</dt><dd>{{ f1(ulasanDetail.beban) }} dari 5</dd>
                <dt>Belajar</dt><dd>sekitar {{ f1(ulasanDetail.jam) }} jam per minggu</dd>
              </dl>
              <div v-for="(u, i) in ulasanDetail.list" :key="i" class="ulasan">
                <p style="margin:0">{{ u.pengalaman }}</p>
                <p class="hint" style="margin:.2rem 0 0">Tips: {{ u.tips }}</p>
                <p class="hint" style="margin:.2rem 0 0">Rating {{ u.rating }}, kesulitan {{ u.kesulitan }}, beban {{ u.beban }}. {{ u.status === 'selesai' ? 'Sudah selesai' : 'Sedang mengambil' }}, semester {{ u.semester }}.</p>
              </div>
            </div>
            <div v-else class="empty">Belum ada ulasan untuk matkul ini. Jadilah yang pertama menulis setelah menempuhnya.</div>
            <div v-for="(u, i) in ulasanDetail.saya" :key="'s' + i" class="ulasan">
              <p style="margin:0">{{ u.pengalaman || '(tanpa teks)' }}</p>
              <p class="hint" style="margin:.2rem 0 0">Ulasanmu, menunggu moderasi. Hanya terlihat olehmu.</p>
            </div>

            <h3>Tulis ulasan</h3>
            <div v-if="!masuk" class="empty">Masuk dengan NIM dan password untuk menulis ulasan. Simpan hasilmu lebih dulu bila belum punya akun.</div>
            <div v-else class="stack">
              <div class="field"><label for="u-r">Rating keseluruhan (1 sampai 5)</label><input id="u-r" type="text" inputmode="numeric" v-model="formUlasan.rating"></div>
              <div class="field"><label for="u-k">Kesulitan (1 sampai 5)</label><input id="u-k" type="text" inputmode="numeric" v-model="formUlasan.kesulitan"></div>
              <div class="field"><label for="u-b">Beban tugas (1 sampai 5)</label><input id="u-b" type="text" inputmode="numeric" v-model="formUlasan.beban"></div>
              <div class="field"><label for="u-j">Jam belajar per minggu</label><input id="u-j" type="text" inputmode="numeric" v-model="formUlasan.jam"></div>
              <div class="field"><label for="u-s">Status</label><select id="u-s" v-model="formUlasan.status"><option value="selesai">Sudah selesai</option><option value="sedang">Sedang mengambil</option></select></div>
              <div class="field"><label for="u-p">Pengalaman</label><textarea id="u-p" rows="3" v-model="formUlasan.pengalaman"></textarea></div>
              <div class="field"><label for="u-t">Tips</label><textarea id="u-t" rows="2" v-model="formUlasan.tips"></textarea></div>
              <p v-if="pesanUlasan" class="hint" role="status">{{ pesanUlasan }}</p>
              <button class="btn small" type="button" @click="kirimUlasan">Kirim ulasan</button>
            </div>
          </template>
        </aside>
      </template>

      <!-- Modal simpan -->
      <div v-if="modalSimpan" class="modal">
        <div class="scrim" @click="modalSimpan = false"></div>
        <div class="box stack" role="dialog" aria-modal="true" aria-label="Simpan hasil">
          <h2>Simpan hasil ini?</h2>
          <p class="hint">Yang disimpan: nilai yang kamu isi, jawaban pertanyaan, dan ringkasan hasil. Kamu bisa menghapusnya kapan saja dari halaman riwayat.</p>
          <label style="display:flex;gap:.5rem"><input type="checkbox" v-model="setuju"> Saya setuju nilai dan hasil saya disimpan.</label>
          <div v-if="!adaAkun" class="field"><label for="pb">Buat password (minimal 6 karakter)</label><input id="pb" type="password" v-model="passBaru" autocomplete="off"></div>
          <p v-if="pesanModal" class="err" role="alert">{{ pesanModal }}</p>
          <div class="row"><button class="btn" type="button" @click="simpanHasil">Simpan hasil</button><button class="btn ghost" type="button" @click="modalSimpan = false">Batal</button></div>
        </div>
      </div>
      <div v-if="notif" class="toast" role="status">{{ notif }}</div>
    </div>`,
  };

  // Matkul yang boleh dipakai langsung di template
  App.computed.M = function () { return M; };
  App.methods.prasyaratCapstone = function () { return DATA.prasyaratCapstone; };

  window.__app = Vue.createApp(App).mount('#app');
})();

</script>
</body>
</html>
